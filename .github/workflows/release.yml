name: Create Automatic GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Windows Executables & Create Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Ensure SemVer in package.json for Electron Builder
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (/^\d+\.\d+$/.test(pkg.version)) {
              pkg.version = pkg.version + '.0';
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
              console.log('SemVer normalized for electron-builder:', pkg.version);
            }
          "

      - name: Build Web & Desktop .EXE
        run: npm run build:electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Web Zip Distributable
        shell: bash
        run: |
          cd dist
          tar -a -c -f ../control-de-horas-web.zip *
          cd ..

      - name: Determine Tag & Release Name
        id: release_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            RELEASE_NAME="Release $TAG_NAME"
          else
            VERSION=$(node -p "require('./package.json').version.replace(/\\.0$/, '')")
            TAG_NAME="v$VERSION"
            RELEASE_NAME="Release v$VERSION (Build #${{ github.run_number }})"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with .EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: ${{ steps.release_info.outputs.release_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release/*.exe
            control-de-horas-web.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

